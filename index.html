const routes = {};
function route(path, fn){ routes[path] = fn; }
function currentHash(){ return location.hash.slice(1) || '/'; }
/* v7: a troca de aba passa por uma transição curta (some 120 ms, volta 280 ms); a troca real fica em navigateCore */
function navigate(){
  if(window.dmTransition) window.dmTransition(navigateCore); else navigateCore();
}
/* 25/10/2026: ao voltar de um perfil, a aba de origem reaparece como estava (filtros, página, ordem e rolagem).
   O link "← Voltar para …" do perfil leva à aba de onde a pessoa veio (antes era sempre Atletas). */
if('scrollRestoration' in history) history.scrollRestoration = 'manual';  // a rolagem de cada aba é guardada abaixo
let rotaAtual = null, origemPerfil = null, voltandoHistorico = false;
window.addEventListener('popstate', ()=>{ voltandoHistorico = true; });
const memoriaAba = {};
function salvaAba(rota){
  const app = document.getElementById('app'); if(!app || !rota) return;
  const campos = {};
  app.querySelectorAll('input[id],select[id]').forEach(el=>{ campos[el.id] = el.type === 'checkbox' ? el.checked : el.value; });
  memoriaAba[rota] = {y: window.scrollY, campos, extra: window.__abaExtra ? window.__abaExtra.get() : null};
}
function restauraAba(rota){
  const m = memoriaAba[rota]; if(!m) return;
  Object.entries(m.campos).forEach(([id, v])=>{
    const el = document.getElementById(id); if(!el) return;
    if(el.type === 'checkbox'){ if(el.checked === v) return; el.checked = v; }
    else { if(el.value === v) return; el.value = v; }
    el.dispatchEvent(new Event('input')); el.dispatchEvent(new Event('change'));
  });
  if(m.extra && window.__abaExtra) window.__abaExtra.set(m.extra);
  const ir = ()=>{ if(Math.abs(window.scrollY - m.y) > 2){ window.scrollTo({top: m.y}); if(window.ScrollTrigger) ScrollTrigger.refresh(); } };
  requestAnimationFrame(()=>requestAnimationFrame(ir));
  setTimeout(ir, 450);   // de novo depois da transição de aba (que termina com um refresh do ScrollTrigger)
}
function nomeDaAba(rota){
  const a = document.querySelector(`.navlink[data-route="${rota}"]`);
  return a ? a.textContent.trim() : 'Atletas';
}
function navigateCore(){
  const hash = currentHash();
  const parts = hash.split('/').filter(Boolean);
  const rotaNova = '/' + parts.join('/');
  const anterior = rotaAtual;
  const vindoDoPerfil = !!anterior && anterior.startsWith('/atleta/');
  if(anterior && !anterior.startsWith('/atleta/')) salvaAba(anterior);
  window.__abaExtra = null;
  if(parts[0] === 'atleta' && parts[1]){ if(!vindoDoPerfil) origemPerfil = anterior; }
  rotaAtual = rotaNova;
  document.querySelectorAll('.navlink').forEach(a=>a.classList.toggle('active', a.dataset.route === '/'+(parts[0]||'')));
  window.scrollTo({top:0});
  document.body.classList.toggle('topo-cena', !parts[0]);
  atualizaTopo();
  const app = document.getElementById('app');
  if(parts[0] === 'atleta' && parts[1]){
    app.innerHTML = viewAtletaDetail(parts[1]);
    const volta = document.getElementById('perfil-voltar');
    if(volta) volta.addEventListener('click', e=>{ if(anterior && anterior === origemPerfil){ e.preventDefault(); history.back(); } });
    initAtletaDetailCharts(parts[1]);
    initAtletaHistSort(parts[1]);
    initPerfilCaixas();
    atualizaNomeAba(parts);
    if(window.dmMotion) window.dmMotion('/atleta');
    return;
  }
  const key = '/'+(parts[0]||'');
  const viewFn = routes[key] || routes['/'];
  app.innerHTML = viewFn();
  if(key === '/') { initEquipeView(); initHomeCharts(); }
  if(key === '/atletas') initAtletasView();
  if(key === '/ranking') initRankingView();
  if(key === '/resultados') initResultadosView();
  if(key === '/competicoes') initCompeticoesView();
  if(key === '/recordes') initRecordesView();
  if(key === '/contato') initContatoView();
  if(key === '/galeria') initGaleriaView();
  if(key === '/equipe') initEquipeView();
  if(key === '/privacidade') initPrivacidadeView();
  iconeDaAba(key);
  atualizaNomeAba(parts);
  if(window.dmMotion) window.dmMotion(key);
  if((vindoDoPerfil && rotaNova === origemPerfil) || voltandoHistorico) restauraAba(rotaNova);
  voltandoHistorico = false;
}

/* v6 (24/10/2026): nome da aba no topo quando o título da página sai da tela (só aparece no celular, via CSS) */
let abaObs = null;
function atualizaNomeAba(parts){
  const nav = document.querySelector('.topnav'), alvo = document.getElementById('bn-aba');
  if(abaObs){ abaObs.disconnect(); abaObs = null; }
  nav.classList.remove('mostra-aba');
  /* etapa 2 (28/10/2026): o ícone da aba desce junto com o nome (perfil e Privacidade não têm ícone) */
  /* perfil do atleta usa o ícone de Atletas (aprovado pelo João 28/10) */
  const ic = document.getElementById('bn-ic'), chave = parts[0] === 'atleta' ? '/atletas' : '/'+(parts[0]||'');
  const temIc = !!(parts[0] && ICONE_ABA[chave]);
  ic.innerHTML = temIc ? svgIconeAba(chave) : '';
  nav.querySelector('.brandname').classList.toggle('tem-ic', temIc);
  const h1 = document.querySelector('#app .pagehead h1, #app h1');
  if(!parts[0] || !h1 || !('IntersectionObserver' in window)){ alvo.textContent = ''; return; }
  const link = document.querySelector('.navlink.active');
  alvo.textContent = (parts[0] === 'atleta' || !link) ? (h1.dataset.curto || h1.textContent.trim()) : link.textContent.trim();
  abaObs = new IntersectionObserver(([e])=>{
    nav.classList.toggle('mostra-aba', !e.isIntersecting && e.boundingClientRect.top < nav.offsetHeight);
  }, {rootMargin:'-'+nav.offsetHeight+'px 0px 0px 0px'});
  abaObs.observe(h1);
}

function poolHighlights(){
  const EVENTS = [
    ['Livre',50], ['Costas',50], ['Peito',50], ['Borboleta',50],
    ['Livre',200], ['Livre',400],
    ['Medley',100], ['Medley',200],
  ];
  return EVENTS.map(([estilo,distancia])=>{
    const rows = DATA.resultados.filter(r=>r.estilo===estilo && r.distancia===distancia);
    if(!rows.length) return null;
    const byAthlete = {};
    rows.forEach(r=>{
      const sec = timeToSec(r.tempo);
      if(!byAthlete[r.atleta] || sec < byAthlete[r.atleta].sec){ byAthlete[r.atleta] = Object.assign({}, r, {sec}); }
    });
    let ranked = Object.values(byAthlete).sort((a,b)=>a.sec-b.sec);
    const n = ranked.length >= 5 ? 5 : Math.min(ranked.length, 3);
    ranked = ranked.slice(0, n);
    return { estilo, distancia, ranked };
  }).filter(Boolean);
}
function aguasAbertasHighlights(){
  const DISTS = [2500, 8000];
  return DISTS.map(distancia=>{
    const rows = DATA.resultados.filter(r=>r.estilo==='Águas Abertas' && r.distancia===distancia);
    if(!rows.length) return null;
    const byAthlete = {};
    rows.forEach(r=>{
      const sec = timeToSec(r.tempo);
      if(!byAthlete[r.atleta] || sec < byAthlete[r.atleta].sec){ byAthlete[r.atleta] = Object.assign({}, r, {sec}); }
    });
    const ranked = Object.values(byAthlete).sort((a,b)=>a.sec-b.sec);
    return { estilo:'Águas Abertas', distancia, ranked };
  }).filter(Boolean);
}
function placeCell(place){
  const n = parseInt(place,10);
  if(n>=1 && n<=3){ const m = ['ouro','prata','bronze'][n-1]; return `<span class="pos-med" title="${n}º lugar"><svg class="mi" viewBox="0 0 24 24" role="img" aria-label="${n}º lugar"><use href="#mini-r3-${m}" width="24" height="24"/></svg></span>`; }
  return `<span class="pos-num">${n||'-'}</span>`;
}

      + `<div class="hc-dm" aria-hidden="true"><i></i><i></i></div></div></div>`
      + (adulto && base ? `<div class="hc-chaves" aria-hidden="true" style="--base:${base};--adulto:${adulto};--nb:${baseF.length};--na:${fases.length - baseF.length}">`
        + `<span class="hc-chave" style="--quando:${Math.round(passa(base / total))}ms"><strong>Base · <b>${base}</b></strong><small>${baseF[0].nome} a ${baseF.at(-1).nome}</small></span>`
        + `<span class="hc-chave" style="--quando:${Math.round(passa(1))}ms"><strong>Time adulto · <b>${adulto}</b></strong><small>Senior</small></span></div>` : '')
      + `</div>`;
    // uma barra só (v79): mede a barra, diz a cada faixa onde ela começa e põe a marca DM no meio do Senior
    const tanque = areaCat.querySelector('.hc-agua-tanque'), faixas = [...tanque.querySelectorAll('.hc-faixa')];
    const mede = ()=>{ const W = tanque.clientWidth, H = tanque.clientHeight; if(!W) return;
      const xs = faixas.map(f=>f.offsetLeft), bx = adultoF ? xs[fases.indexOf(adultoF)] : W;
      const p = (v)=>`${(v / W * 100).toFixed(2)}%`;
      tanque.style.setProperty('--agua', `linear-gradient(90deg in oklab, ${AGUA[0]} 0%, ${AGUA[1]} ${p(bx * .35)}, ${AGUA[2]} ${p(bx * .7)}, ${AGUA[3]} ${p(bx)}, ${AGUA[4]} ${p(bx + (W - bx) * .35)}, ${AGUA[5]} ${p(bx + (W - bx) * .7)}, ${AGUA[6]} 100%)`);
      tanque.style.setProperty('--W', W + 'px'); faixas.forEach((f, k)=>f.style.setProperty('--x', xs[k] + 'px'));
      const mh = Math.min(H * .8, Math.max(W - bx, 40) / 2.2 * .9), mw = mh * 2.2;
      tanque.style.setProperty('--mw', mw + 'px'); tanque.style.setProperty('--mh', mh + 'px');
      tanque.style.setProperty('--mx', (adultoF ? bx + (W - bx - mw) / 2 : (W - mw) / 2) + 'px'); tanque.style.setProperty('--my', (H - mh) / 2 + 'px');
      tanque.classList.add('hc-um'); };
    mede(); if('ResizeObserver' in window) new ResizeObserver(mede).observe(tanque);
    // legenda dividida (v93, 04/11), igual ao Pódio e às Raias, sem balão: sem tocar, Base | Time adulto (medalhas em N provas);
    // ao tocar, a fase (medalhas em N provas) | Idade (faixa de idade e categorias) — o nome da fase aparece uma vez só
    const catsDe = (f)=>f === adultoF ? 'Time adulto' : !f.nums.length ? 'categoria única'
      : f.nums.length === 1 ? `categoria ${f.nums[0]}` : `categorias ${f.nums.slice(0, -1).join(', ')} e ${f.nums.at(-1)}`;
    const pintaCat = (i)=>{
      if(i < 0) return hcInfo(infoCat, ['Base', qtd(somaF(baseF, 'med'), 'medalha', 'medalhas'), `em ${qtd(somaF(baseF, 'provas'), 'prova', 'provas')}`],
        ['Time adulto', qtd(adultoF ? adultoF.med : 0, 'medalha', 'medalhas'), `em ${qtd(adultoF ? adultoF.provas : 0, 'prova', 'provas')}`]);
      const f = fases[i];
      hcInfo(infoCat, [f.nome, qtd(f.med, 'medalha', 'medalhas'), `em ${qtd(f.provas, 'prova', 'provas')}`], ['Idade', f.idade || '—', catsDe(f)]); };
    let trocaCat = 0, primeiraC = true;
    hcDestaque(areaCat, (i)=>{
      // a legenda apaga e acende de novo com o texto novo (fusão suave, como no Pódio e nas Raias)
      if(primeiraC || reduzMov()){ primeiraC = false; return pintaCat(i); }
      infoCat.classList.add('hc-troca'); clearTimeout(trocaCat);
      trocaCat = setTimeout(()=>{ pintaCat(i); infoCat.classList.remove('hc-troca'); }, 220); });
    // o total do título conta junto com a água
    const contaTotal = ()=>{ const el = titCat.querySelector('.hc-total b'); if(!el || reduzMov()) return;
      const t0 = performance.now() + ENCHE_INI;
      const passo = (t)=>{ const k = Math.min(1, Math.max(0, (t - t0) / ENCHE_MS)); el.textContent = Math.round(total * (1 - Math.pow(1 - k, 3)));
        if(k < 1 && el.isConnected) requestAnimationFrame(passo); };
      el.textContent = '0'; requestAnimationFrame(passo); };
    hcEntrada(document.getElementById('card-cat'), ()=>{ contaTotal(); ligaInfo(infoCat); });
  }
}

function escCloseHandler(e){ if(e.key === 'Escape') closeCV(); }
function openCV(id){
  const d = CV_DATA[id];
  if(!d) return;
  const overlay = document.createElement('div');
  overlay.className = 'cv-modal-overlay';
  overlay.id = 'cv-modal-overlay';
  overlay.innerHTML = `
    <div class="cv-modal">
      <button class="cv-modal-close" aria-label="Fechar">✕</button>
      <div class="cv-role">${esc(d.role)}</div>
      <h3>${esc(d.nome)}</h3>
      ${d.secoes.map(s => `
        <h4>${esc(s.titulo)}</h4>
        <ul>${s.itens.map(it => `<li>${esc(it)}</li>`).join('')}</ul>
      `).join('')}
    </div>`;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeCV(); });
  overlay.querySelector('.cv-modal-close').addEventListener('click', closeCV);
  document.body.appendChild(overlay);
  document.addEventListener('keydown', escCloseHandler);
}
function closeCV(){
  const overlay = document.getElementById('cv-modal-overlay');
  if(overlay) overlay.remove();
  document.removeEventListener('keydown', escCloseHandler);
}

let activeAthlete = null;
function initAtletasView(){
  activeAthlete = null;

    switch(key){
      case 'atleta': return r.atleta||'';
      case 'prova': return r.distancia*1000 + (r.estilo||'').charCodeAt(0);
      case 'categoria': return catRank(r.categoria);
      case 'tempo': return timeToSec(r.tempo);
      case 'colocacao': return placeToNum(r.colocacao);
      case 'data': return parseDateBR(r.data);
      case 'competicao': return r.competicao||'';
      case 'it': return parseFloat(r.it)||0;
      default: return '';
    }
  };
  const render = (manter)=>{
    if(manter !== true) mostrar = POR_VEZ;
    const f = {
      nome: document.getElementById('f-nome').value.trim().toLowerCase(),
      categoria: document.getElementById('f-categoria').value,
      sexo: document.getElementById('f-sexo').value,
      estilo: document.getElementById('f-estilo').value,
      distancia: document.getElementById('f-distancia').value,
      ano: document.getElementById('f-ano').value,
      cidade: document.getElementById('f-cidade').value,
      competicao: document.getElementById('f-competicao').value,
      soRecorde: document.getElementById('f-recorde').checked,
    };
    const filtered = DATA.resultados.filter(r=>{
      if(f.nome && !displayName(r.atleta).toLowerCase().includes(f.nome)) return false;
      if(f.categoria && r.categoria !== f.categoria) return false;
      if(f.sexo && r.sexo !== f.sexo) return false;
      if(f.estilo && r.estilo !== f.estilo) return false;
      if(f.distancia && String(r.distancia) !== String(f.distancia)) return false;
      if(f.ano && anoOf(r.data) !== f.ano) return false;
      if(f.cidade && (r.cidade||'Não informada') !== f.cidade) return false;
      if(f.competicao && r.competicao !== f.competicao) return false;
      if(f.soRecorde && !r.recorde) return false;
      return true;
    });
    const athleteNames = [...new Set(filtered.map(r=>r.atleta))];
    const cardsEl = document.getElementById('cards');
    cardsEl.innerHTML = '';
    if(athleteNames.length===0){ cardsEl.innerHTML = '<div class="emptystate">Nenhum atleta encontrado com esses filtros.</div>'; }
    const athletesInfo = athleteNames.map(name=>{
      const rows = DATA.resultados.filter(r=>r.atleta===name);
      const filteredRows = filtered.filter(r=>r.atleta===name);
      const meta = ATHLETE_BY_NAME[name] || rows[0];
      const m = athleteMedals(name);
      return {name, meta, filteredRows, provas: rows.length, ...m};
    }).sort((a,b)=> a.name.localeCompare(b.name));

    athletesInfo.slice(0, mostrar).forEach(info=>{
      const isDiego = info.name === 'Diego Meza';
      const card = document.createElement('div');
      card.className = 'acard' + (isDiego ? ' acard-diego':'') + (activeAthlete===info.name ? ' active':'');
      const chips = info.filteredRows.slice(0,4).map(r=>
        `<span class="eventchip ${r.recorde?'rec':''}">${r.distancia}m ${r.estilo} · ${fmtTempo(r.tempo)}${selo50(r)}${r.recorde?' 🏅':''}</span>`).join('');
      card.innerHTML = `
        <div class="acard-top">
          <div class="avatar"><span>${initials(displayName(info.name))}</span></div>
          <div><div class="acard-name">${displayName(info.name)}</div><div class="acard-meta">${fmtCat(info.meta.categoria)} · ${info.meta.sexo==='F'?'Feminino':'Masculino'}</div></div>
        </div>
        <div class="medals-row">${medalRow(info)}</div>
        <div class="eventchips">${chips}</div>`;
      card.onclick = ()=>{ location.hash = '#/atleta/' + (info.meta.slug || slugify(info.name)); };
      cardsEl.appendChild(card);
    });
    const restam = athletesInfo.length - mostrar;
    if(restam > 0){
      const mais = document.createElement('div');
      mais.className = 'cards-mais';
      mais.innerHTML = `<button type="button" class="btn-mais">Ver mais atletas <span>(${restam})</span></button>`;
      mais.querySelector('button').onclick = ()=>{
        mostrar += POR_VEZ; render(true);
        const cards = cardsEl.querySelectorAll('.acard');
        const prox = cards[mostrar - POR_VEZ];
        if(prox){ prox.setAttribute('tabindex','-1'); prox.focus({preventScroll:true}); }
        if(window.ScrollTrigger) ScrollTrigger.refresh();
      };
      cardsEl.appendChild(mais);
    }

    let tableRows = filtered;
    tableRows = [...tableRows].sort((a,b)=>cmp(atlAccessor(a,atlSortState.key), atlAccessor(b,atlSortState.key), atlSortState.dir));
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    tableRows.forEach(r=>{
      const tr = document.createElement('tr');
      if(r.recorde) tr.className = 'record';
      tr.innerHTML = `
        <td><a class="rowlink" href="#/atleta/${ATHLETE_BY_NAME[r.atleta]?ATHLETE_BY_NAME[r.atleta].slug:slugify(r.atleta)}">${displayName(r.atleta)}</a></td>

      tbody.appendChild(tr);

    document.getElementById('cd-info').textContent = `${filtered.length} ${filtered.length===1?'resultado':'resultados'}`;
    document.getElementById('tabletitle').textContent = 'Todos os resultados' + (athleteNames.length ? ` (${athleteNames.length} atletas)` : '');
    updateSortIndicators(document.getElementById('atl-thead'), atlSortState);

    ['f-categoria','f-sexo','f-estilo','f-distancia','f-ano','f-cidade','f-competicao'].forEach(id=>document.getElementById(id).value='');

    const el = document.getElementById(id);

}

/* "29 e 30/11/2025" quando os dias são do mesmo mês; senão "dd/mm/aaaa · dd/mm/aaaa" */
function textoDatas(datas){
  const ds = [...new Set(datas)].sort((a,b)=>parseDateBR(a)-parseDateBR(b));
  const mesAno = d => d.slice(3);
  if(ds.length > 1 && ds.every(d=>mesAno(d)===mesAno(ds[0]))){
    const dias = ds.map(d=>d.slice(0,2));
    return dias.slice(0,-1).join(', ') + ' e ' + dias[dias.length-1] + '/' + mesAno(ds[0]);
  }
  return ds.join(' · ');
}
/* linha do tempo do perfil: agrupa por competição + ano, mais recente no topo ("29 e 30/11/2025") */
function linhaDoTempo(rows){
  const grupos = {};
  rows.forEach(r=>{
    const k = r.competicao + '|' + anoOf(r.data);
    (grupos[k] = grupos[k] || {comp:r.competicao, datas:new Set()}).datas.add(r.data);
  });
  return Object.values(grupos).map(g=>{
    const ds = [...g.datas].sort((a,b)=>parseDateBR(a)-parseDateBR(b));
    const mesAno = d => d.slice(3);
    let txt;
    if(ds.length > 1 && ds.every(d=>mesAno(d)===mesAno(ds[0]))){
      const dias = ds.map(d=>d.slice(0,2));
      txt = dias.slice(0,-1).join(', ') + ' e ' + dias[dias.length-1] + '/' + mesAno(ds[0]);
    } else txt = ds.join(' · ');
    return {comp:g.comp, datas:txt, quando:parseDateBR(ds[ds.length-1])};
  }).sort((a,b)=>b.quando-a.quando);
}

function periodoAnos(rows){
  const anos = uniqueSorted(rows.map(r=>anoOf(r.data)).filter(Boolean));
  if(!anos.length) return '';
  return ` · ${anos[0]}${anos.length > 1 ? ' a ' + anos[anos.length-1] : ''}`;

function caixaPerfil(id, nome, resumo, ver, corpo){
  return `<div class="card perfil-caixa" data-caixa="${id}" data-nome="${nome}">
    <button type="button" class="pc-cab" aria-expanded="false" aria-controls="pc-${id}">

function marcarCaixa(cx, abrir){
  const cab = cx.querySelector('.pc-cab');
  cx.querySelector('.pc-corpo').hidden = !abrir;
  cx.classList.toggle('aberto', abrir); cab.setAttribute('aria-expanded', abrir);
  cab.querySelector('.comp-acao').innerHTML = abrir ? ACAO_RECOLHER : (cx.dataset.ver + ' <span aria-hidden="true">▾</span>');
}
function botaoRecolherPerfil(){
  let b = document.getElementById('perfil-recolher');
  if(b) return b;
  b = document.createElement('button');
  b.id = 'perfil-recolher'; b.type = 'button'; b.className = 'comp-recolher';
  document.body.appendChild(b);
  let pendente = false;
  const atualizar = ()=>{
    pendente = false;
    // a caixa aberta que está na tela: o topo já subiu e o fim (com o "Recolher" de baixo) ainda não apareceu
    const cx = [...document.querySelectorAll('#app .perfil-caixa.aberto')].find(c=>{
      const r = c.getBoundingClientRect();
      return c.querySelector('.pc-cab').getBoundingClientRect().bottom < topoLivre() && r.bottom > window.innerHeight - 8;
    });
    if(cx && b.dataset.caixa !== cx.dataset.caixa){
      b.dataset.caixa = cx.dataset.caixa;
      b.innerHTML = `${SETA_CIMA}Recolher<span class="cr-nome">${cx.dataset.nome}</span>`;
      b.setAttribute('aria-label', 'Recolher ' + cx.dataset.nome);
    }
    b.classList.toggle('on', !!cx);
  };
  const pedir = ()=>{ if(!pendente){ pendente = true; requestAnimationFrame(atualizar); } };
  window.addEventListener('scroll', pedir, {passive:true});
  window.addEventListener('resize', pedir);
  window.addEventListener('hashchange', ()=>b.classList.remove('on'));
  b.atualizar = pedir;
  b.addEventListener('click', ()=>{
    const cx = document.querySelector(`#app .perfil-caixa[data-caixa="${b.dataset.caixa}"]`);
    b.classList.remove('on');
    if(cx){ marcarCaixa(cx, false); rolarAteCartao(cx); cx.querySelector('.pc-cab').focus({preventScroll:true}); }
  });
  return b;
}
function initPerfilCaixas(){
  const fixo = botaoRecolherPerfil();
  document.querySelectorAll('#app .perfil-caixa').forEach(cx=>{
    cx.dataset.ver = cx.querySelector('.comp-acao').firstChild.textContent.trim();
    const alternar = fechar=>{
      marcarCaixa(cx, !cx.classList.contains('aberto'));
      if(fechar || cx.getBoundingClientRect().top < topoLivre() - 12) rolarAteCartao(cx);
      if(fechar) cx.querySelector('.pc-cab').focus({preventScroll:true});
      fixo.atualizar();
    };
    cx.querySelector('.pc-cab').addEventListener('click', ()=>alternar(false));
    cx.querySelector('.comp-fechar button').addEventListener('click', ()=>alternar(true));
  });
}

    switch(key){
      case 'data': return parseDateBR(r.data);

  wireSortableHeaders(thead, sortState, render);

}
function styleTimeSeries(name, estilo){
  const rows = athleteRows(name).filter(r=>r.estilo===estilo);
  if(!rows.length) return {distancia:null, rows:[]};
  const byDist = {};
  rows.forEach(r=>{ (byDist[r.distancia] = byDist[r.distancia] || []).push(r); });
  let bestDist = null, bestCount = -1;
  Object.keys(byDist).map(Number).sort((a,b)=>a-b).forEach(d=>{
    const c = byDist[d].length;
    if(c > bestCount){ bestCount = c; bestDist = d; }
  });
  const evRows = byDist[bestDist].slice().sort((a,b)=>parseDateBR(a.data)-parseDateBR(b.data));
  return {distancia:bestDist, rows:evRows};
}

let evoChartInstance = null;
/* Carrega o Chart.js só quando precisa (perfil do atleta); com SRI, igual ao antigo <script> do <head> */
let chartJsPromessa = null;
function carregarChartJs(){
  if(window.Chart) return Promise.resolve();
  if(!chartJsPromessa){
    chartJsPromessa = new Promise((ok, falha)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js';
      s.integrity = 'sha384-DhxhYObIMeMNGyAG7iK11OHzBIKyEIeRL0ad1iFPAOwZB8iirUlTT0O/WJJUk8+o';
      s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
      s.onload = ok;
      s.onerror = ()=>{ chartJsPromessa = null; falha(new Error('Chart.js não carregou')); };
      document.head.appendChild(s);
    });
  }
  return chartJsPromessa;
}
function initAtletaDetailCharts(slug){
  carregarChartJs().then(()=>{
    // se a pessoa já saiu do perfil enquanto carregava, não desenha
    if(document.getElementById('chart-evolucao')) montarGraficoAtleta(slug);
  }).catch(()=>{});
}
function montarGraficoAtleta(slug){
  const name = SLUG_TO_NAME[slug];
  if(!name) return;
  const ESTILOS = ['Livre','Costas','Peito','Borboleta','Medley'];
  const rows = athleteRows(name);
  const disponiveis = ESTILOS.filter(e=>rows.some(r=>r.estilo===e));
  if(!disponiveis.length) return;

  const counts = {};
  disponiveis.forEach(e=>{ counts[e] = rows.filter(r=>r.estilo===e).length; });
  let estiloAtivo = disponiveis.slice().sort((a,b)=>counts[b]-counts[a])[0];

  const tabsEl = document.getElementById('evo-style-tabs');
  const subEl = document.getElementById('evo-sub');
  const canvas = document.getElementById('chart-evolucao');
  if(!canvas) return;

  function renderTabs(){
    if(!tabsEl) return;
    tabsEl.innerHTML = disponiveis.map(e=>
      `<button type="button" class="evo-tab${e===estiloAtivo?' active':''}" data-estilo="${e}">${e}</button>`
    ).join('');
    tabsEl.querySelectorAll('.evo-tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        estiloAtivo = btn.getAttribute('data-estilo');
        renderTabs();
        renderChart();
      });
    });
  }

  function renderChart(){
    const { distancia, rows: evRows } = styleTimeSeries(name, estiloAtivo);
    if(subEl) subEl.textContent = distancia ? `${distancia}m ${estiloAtivo} — evolução cronológica` : '';

    const css = getComputedStyle(document.documentElement);
    const turq = css.getPropertyValue('--turq').trim();
    const muted = css.getPropertyValue('--muted').trim();
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const tickColor = isDark ? '#AEBFD1' : muted;
    const gridColor = isDark ? 'rgba(255,255,255,.08)' : 'rgba(15,27,45,.07)';   // grade mais leve (opção A, 28/10)
    const shortDate = (d)=>{ const p = d.split('/'); return p.length===3 ? `${p[0]}/${p[1]}/${p[2].slice(2)}` : d; };

    const secsArr = evRows.map(r=>timeToSec(r.tempo));
    const minSecRaw = Math.min(...secsArr), maxSecRaw = Math.max(...secsArr);
    const range = maxSecRaw - minSecRaw;
    let stepSize = 1;
    if(range > 120) stepSize = 30;
    else if(range > 60) stepSize = 10;
    else if(range > 20) stepSize = 5;
    else if(range > 8) stepSize = 2;
    const yMin = Math.floor(minSecRaw / stepSize) * stepSize;
    const yMax = Math.ceil(maxSecRaw / stepSize) * stepSize;

    /* anos no gráfico — opção A "divisória discreta" (escolha do João 28/10, estilo FT/The Economist):
       linha fina pontilhada onde cada ano começa e o ano em cinza embaixo, no começo dele; a data exata fica na caixinha */
    const grupos = [];
    evRows.forEach((r,i)=>{ const a = anoOf(r.data); const g = grupos[grupos.length-1];
      if(g && g.ano === a) g.fim = i; else grupos.push({ano:a, ini:i, fim:i}); });
    const corDivisa = isDark ? 'rgba(147,168,201,.45)' : 'rgba(86,104,138,.38)';
    const divisaAno = { id:'divisaAno',
      limites(chart){
        const x = chart.scales.x, area = chart.chartArea, n = evRows.length, px = i=>x.getPixelForValue(i);
        return grupos.map(g=>({ ...g,
          esq: g.ini === 0 ? area.left : (px(g.ini-1) + px(g.ini)) / 2,
          dir: g.fim === n-1 ? area.right : (px(g.fim) + px(g.fim+1)) / 2 }));
      },
      beforeDatasetsDraw(chart){
        const {ctx, chartArea:area} = chart;
        ctx.save(); ctx.strokeStyle = corDivisa; ctx.lineWidth = 1; ctx.setLineDash([3,4]);
        this.limites(chart).slice(1).forEach(g=>{ const x = Math.round(g.esq) + .5;
          ctx.beginPath(); ctx.moveTo(x, area.top); ctx.lineTo(x, area.bottom); ctx.stroke(); });
        ctx.restore();
      },
      afterDraw(chart){
        const {ctx, chartArea:area} = chart, y = area.bottom + 10;
        ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = tickColor;
        ctx.font = '500 11px Jost, sans-serif';
        this.limites(chart).forEach((g,k)=>{
          const w = g.dir - g.esq - 6;   // espaço até a próxima divisória
          const rot = w >= 28 ? g.ano : (w >= 18 ? '’' + g.ano.slice(2) : '');
          if(rot) ctx.fillText(rot, g.esq + (k ? 6 : 2), y);
        });
        ctx.restore();
      } };
    // área com degradê que some para baixo (menos peso no gráfico)
    const degrade = canvas.getContext('2d').createLinearGradient(0, 0, 0, canvas.clientHeight || 260);
    degrade.addColorStop(0, isDark ? 'rgba(79,174,255,.22)' : 'rgba(63,163,255,.18)');
    degrade.addColorStop(1, 'rgba(63,163,255,0)');
    // régua da esquerda: "24s" abaixo de 1 minuto, "2:02" acima
    const rotuloY = v=>{ const s = Math.round(v); return s < 60 ? s + 's' : Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0'); };
    // etapa 4: guia vertical pontilhada do ponto destacado até a base
    const corGuia = isDark ? 'rgba(124,196,255,.55)' : 'rgba(11,42,102,.32)';
    const guiaPonto = { id:'guiaPonto',
      beforeDatasetsDraw(chart){
        const a = chart.getActiveElements(); if(!a.length) return;
        const {ctx, chartArea:area} = chart, el = a[0].element, x = Math.round(el.x) + .5;
        ctx.save(); ctx.strokeStyle = corGuia; ctx.lineWidth = 1; ctx.setLineDash([2,3]);
        ctx.beginPath(); ctx.moveTo(x, el.y); ctx.lineTo(x, area.bottom); ctx.stroke(); ctx.restore();
      } };
    if(evoChartInstance){ evoChartInstance.destroy(); evoChartInstance = null; }
    evoChartInstance = new Chart(canvas, {
      type:'line',
      data:{ labels: evRows.map(r=>shortDate(r.data)),
        datasets:[{label:'Tempo', data: evRows.map(r=>timeToSec(r.tempo)), borderColor:turq, backgroundColor:degrade,
          tension:.35, borderWidth:2.5, fill:true, pointRadius:3.5, pointHoverRadius:6.5, pointBackgroundColor:apagaFora(turq, .6), pointBorderWidth:0,
          pointHoverBackgroundColor:turq, pointHoverBorderColor:isDark ? '#0B1A38' : '#FFFFFF', pointHoverBorderWidth:2.5 }]},
      plugins:[divisaAno, guiaPonto, destaqueGrafico],
      options:{ layout:{padding:{top:8,right:8,bottom:26}}, events:[], animations:ANIM_DESTAQUE,
        interaction:{mode:'nearest', intersect:false},
        plugins:{ legend:{display:false},
          /* etapa 3 (28/10/2026): caixinha enxuta — só a data curta (pequena) e o tempo no padrão da natação (grande) */
          tooltip:{ ...CAIXINHA_DM,
            callbacks:{
              title:(items)=>shortDate(evRows[items[0].dataIndex].data),
              label:(ctx)=>fmtTempo(evRows[ctx.dataIndex].tempo) } } },
        scales:{
          x:{ offset:true, ticks:{display:false}, grid:{display:false}, border:{display:false} },   // os anos vêm do plugin divisaAno; offset = meio passo nas pontas
          y:{ beginAtZero:false, min:yMin, max:yMax, border:{display:false},
              ticks:{ stepSize, color:tickColor, font:{family:'Jost', size:11}, callback:rotuloY }, grid:{color:gridColor, drawTicks:false} }
        } }
    });
  }

  renderTabs();
  renderChart();
}

function initResultadosView(){
  const sortState = {key:'data', dir:'desc'};
  let compFixa = window.__filtroComp || ''; window.__filtroComp = null;
  const PAGE_SIZE = 25;
  let page = 1;
  const accessor = (r,key)=>{
    switch(key){
      case 'data': return parseDateBR(r.data);
      case 'competicao': return r.competicao||'';
      case 'cidade': return r.cidade||'';
      case 'atleta': return r.atleta||'';
      case 'categoria': return catRank(r.categoria);

      case 'tempo': return timeToSec(r.tempo);
      case 'colocacao': return placeToNum(r.colocacao);
      case 'pontos': return parseFloat(r.pontos)||0;
      case 'it': return parseFloat(r.it)||0;
      default: return '';
    }
  };
  const renderPagination = (totalRows)=>{
    const totalPages = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));
    if(page > totalPages) page = totalPages;
    const el = document.getElementById('rs-pagination');
    if(totalPages <= 1){ el.innerHTML = ''; return; }
    const nums = [];
    for(let p=1;p<=totalPages;p++){
      if(p===1 || p===totalPages || Math.abs(p-page)<=1) nums.push(p);
      else if(nums[nums.length-1] !== '…') nums.push('…');
    }
    el.innerHTML = `
      <button class="page-btn" id="pg-prev" ${page===1?'disabled':''}>← Anterior</button>
      <div class="page-nums">${nums.map(p=> p==='…' ? `<span class="page-ellipsis">…</span>` : `<button class="page-num ${p===page?'active':''}" data-page="${p}">${p}</button>`).join('')}</div>
      <button class="page-btn" id="pg-next" ${page===totalPages?'disabled':''}>Próxima →</button>
    `;
    const subir = ()=>{ const t = document.getElementById('rs-tabela'); if(t) window.scrollTo({top: t.getBoundingClientRect().top + window.scrollY - 88, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); };
    const prevBtn = document.getElementById('pg-prev');
    const nextBtn = document.getElementById('pg-next');
    if(prevBtn) prevBtn.onclick = ()=>{ if(page>1){ page--; render(); subir(); } };
    if(nextBtn) nextBtn.onclick = ()=>{ if(page<totalPages){ page++; render(); subir(); } };
    el.querySelectorAll('.page-num').forEach(btn=>{
      btn.onclick = ()=>{ page = parseInt(btn.dataset.page,10); render(); subir(); };
    });
  };
  const render = ()=>{
    const busca = norm(document.getElementById('rs-busca').value);
    const ano = document.getElementById('rs-ano').value;
    const categoria = document.getElementById('rs-categoria').value;
    const soRecorde = document.getElementById('rs-recorde').checked;
    let rows = DATA.resultados.filter(r=>{
      if(compFixa && r.competicao !== compFixa) return false;
      if(busca && !(norm(displayName(r.atleta)).includes(busca) || norm(r.competicao).includes(busca))) return false;
      if(ano && anoOf(r.data) !== ano) return false;
      if(categoria && r.categoria !== categoria) return false;
      if(soRecorde && !r.recorde) return false;
      return true;
    });
    rows = rows.slice().sort((a,b)=>cmp(accessor(a,sortState.key), accessor(b,sortState.key), sortState.dir));
    document.getElementById('rs-count').innerHTML = `<b>${rows.length}</b> resultado${rows.length===1?'':'s'} encontrado${rows.length===1?'':'s'}`
      + (compFixa ? ` <button type="button" class="chip-comp" id="rs-limpa-comp" aria-label="Tirar o filtro da competição">${compFixa} <span aria-hidden="true">✕</span></button>` : '');
    const lc = document.getElementById('rs-limpa-comp'); if(lc) lc.onclick = ()=>{ compFixa = ''; page = 1; render(); };
    const totalRows = rows.length;
    const totalPages = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));
    if(page > totalPages) page = totalPages;
    const start = (page-1)*PAGE_SIZE;
    const pageRows = rows.slice(start, start+PAGE_SIZE);
    document.getElementById('rs-tbody').innerHTML = pageRows.map(r=>`<tr class="${r.recorde?'record':''} ${r.atleta==='Diego Meza'?'diego-row':''}">
      <td>${r.data}</td><td>${r.competicao}</td><td>${r.cidade||'—'}</td>
      <td><a class="rowlink ${r.atleta==='Diego Meza'?'diego-name':''}" href="#/atleta/${ATHLETE_BY_NAME[r.atleta]?ATHLETE_BY_NAME[r.atleta].slug:slugify(r.atleta)}">${displayName(r.atleta)}</a></td>
      <td>${fmtCat(r.categoria)}</td><td>${r.distancia}m ${r.estilo}</td>
      <td><b>${fmtTempo(r.tempo)}</b>${selo50(r)}${r.recorde?`<span class="badge-rec" style="margin-left:6px">${r.recorde}</span>`:''}</td>
      <td>${placeCell(r.colocacao)}</td><td>${fmt(r.pontos)}</td><td>${fmt(r.it)}</td></tr>`).join('')
      || `<tr class="rs-vazio"><td colspan="10" style="text-align:center;color:var(--muted);padding:30px;">Nenhum resultado encontrado.</td></tr>`;
    updateSortIndicators(document.getElementById('rs-thead'), sortState);
    renderPagination(totalRows);
  };
  wireSortableHeaders(document.getElementById('rs-thead'), sortState, ()=>{ page=1; render(); });
  ['rs-busca'].forEach(id=>document.getElementById(id).addEventListener('input', ()=>{ page=1; render(); }));
  ['rs-ano','rs-categoria','rs-recorde'].forEach(id=>document.getElementById(id).addEventListener('change', ()=>{ page=1; render(); }));
  render();
  window.__abaExtra = {get:()=>({page, comp:compFixa, sort:{...sortState}}), set:e=>{ Object.assign(sortState, e.sort); compFixa = e.comp || ''; page = e.page; render(); }};
}

    if(!byComp[key]) byComp[key] = { nome:r.competicao, cidade:r.cidade, datas:[], atletas:new Set(), provas:0, ouro:0, prata:0, bronze:0, aa:false };
    const c = byComp[key];
    c.datas.push(r.data); c.atletas.add(r.atleta); c.provas++;
    if(r.colocacao === '1º' || r.colocacao === 1) c.ouro++;
    else if(r.colocacao === '2º' || r.colocacao === 2) c.prata++;
    else if(r.colocacao === '3º' || r.colocacao === 3) c.bronze++;
    if(r.estilo === 'Águas Abertas') c.aa = true;
  });
  Object.values(byComp).forEach(c=>{
    if(/águas abertas|travessia/i.test(c.nome)) c.aa = true;
    c.quando = Math.max(...c.datas.map(parseDateBR));
    c.textoData = textoDatas(c.datas);
    c.ano = new Date(c.quando).getFullYear() || 'Sem data';
  });
  const comps = Object.values(byComp).sort((a,b)=>b.quando-a.quando);
  window.__comps = comps;
  const byYear = {};
  comps.forEach(c=>{ (byYear[c.ano] = byYear[c.ano] || []).push(c); });
  const years = Object.keys(byYear).sort((a,b)=>b.localeCompare(a));
  const meds = c => [['ouro',c.ouro],['prata',c.prata],['bronze',c.bronze]].filter(x=>x[1]>0)

  const card = c=>`
      <div class="card comp-card" data-comp="${comps.indexOf(c)}" role="button" tabindex="0" aria-expanded="false">
        <div class="comp-head">
          <h3>${c.nome}</h3>
          <span class="pill">${c.textoData}</span>
        </div>
        <div class="comp-meta">
          ${compTypeBadge(c.aa)}
          <span>📍 ${c.cidade||'Palmas/TO'}</span>
          <span class="comp-num">${plural(c.atletas.size, 'atleta', 'atletas')} · ${plural(c.provas, 'prova', 'provas')}</span>
        </div>
        <div class="comp-pe"><span class="comp-meds">${meds(c)}</span><span class="comp-acao"></span></div>
        <div class="comp-lista" hidden></div>
      </div>`;
  return `
  <div class="wrap">
    <div class="pagehead"><h1>Competições</h1><p>Próximos eventos e todas as competições em que a equipe DM Natação esteve presente.</p></div>
    <div class="section-title"><span class="bar"></span>Próximas competições</div>
    ${proximasCompeticoesHTML()}
    <div class="section-title"><span class="bar"></span>Já realizadas</div>
    <div class="year-list">
      ${years.map((y,i)=>{
        const list = byYear[y];
        const t = list.reduce((s,c)=>({o:s.o+c.ouro,p:s.p+c.prata,b:s.b+c.bronze}),{o:0,p:0,b:0});
        return `
      <details class="year-box" data-ano="${y}"${i===0?' open':''}>
        <summary>
          <span class="year-num">${y}</span>
          <span class="year-info">${plural(list.length,'competição','competições')}<span class="year-meds">${meds({ouro:t.o,prata:t.p,bronze:t.b})}</span></span>
          <span class="year-chev" aria-hidden="true"></span>
        </summary>
        <div class="gridcols2 year-grid">${list.map(card).join('')}</div>
      </details>`;}).join('')}
    </div>
    <footer>DM Natação — Palmas/TO<span class="ft-sep"> · </span><a class="ft-priv" href="#/privacidade">Política de Privacidade</a></footer>
  </div>`;

function listaDaCompeticao(c){
  const rows = DATA.resultados.filter(r=>r.competicao===c.nome);

  rows.forEach(r=>{ (porAtleta[r.atleta] = porAtleta[r.atleta] || []).push(r); });

}
const SETA_CIMA = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 10 8 5.5 12.5 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ACAO_VER = 'Ver atletas <span aria-hidden="true">▾</span>', ACAO_RECOLHER = 'Recolher <span aria-hidden="true">▴</span>';
function topoLivre(){ const n = document.querySelector('.topnav'); return (n ? n.getBoundingClientRect().bottom : 0) + 12; }
function rolarAteCartao(card){
  const y = card.getBoundingClientRect().top + window.scrollY - topoLivre();
  window.scrollTo({top:Math.max(0,y), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}
function marcarCartao(card, abrir){
  const lista = card.querySelector('.comp-lista');
  if(abrir && !lista.innerHTML) lista.innerHTML = listaDaCompeticao(window.__comps[+card.dataset.comp]) +
    `<div class="comp-fechar"><button type="button">${SETA_CIMA}Recolher</button></div>`;
  lista.hidden = !abrir; card.classList.toggle('aberto', abrir); card.setAttribute('aria-expanded', abrir);
  card.querySelector('.comp-acao').innerHTML = abrir ? ACAO_RECOLHER : ACAO_VER;
}
/* botão fixo "Recolher": aparece quando o topo do cartão aberto sai da tela e some quando o fim do cartão (com o "Recolher" de baixo) aparece */
function botaoRecolher(){
  let b = document.getElementById('comp-recolher');
  if(b) return b;
  b = document.createElement('button');
  b.id = 'comp-recolher'; b.type = 'button'; b.className = 'comp-recolher';
  document.body.appendChild(b);
  let pendente = false;
  const atualizar = ()=>{
    pendente = false;
    const card = document.querySelector('#app .comp-card.aberto');
    let mostrar = false;
    if(card){
      const r = card.getBoundingClientRect(), topo = card.querySelector('.comp-pe').getBoundingClientRect();
      mostrar = topo.bottom < topoLivre() && r.bottom > window.innerHeight - 8;
    }
    if(mostrar && b.dataset.comp !== card.dataset.comp){
      b.dataset.comp = card.dataset.comp;
      b.innerHTML = `${SETA_CIMA}Recolher<span class="cr-nome">${window.__comps[+card.dataset.comp].nome}</span>`;
      b.setAttribute('aria-label', 'Recolher ' + window.__comps[+card.dataset.comp].nome);
    }
    b.classList.toggle('on', mostrar);
  };
  const pedir = ()=>{ if(!pendente){ pendente = true; requestAnimationFrame(atualizar); } };
  window.addEventListener('scroll', pedir, {passive:true});
  window.addEventListener('resize', pedir);
  window.addEventListener('hashchange', ()=>b.classList.remove('on'));
  b.atualizar = pedir;
  b.addEventListener('click', ()=>{
    const card = document.querySelector(`#app .comp-card[data-comp="${b.dataset.comp}"]`);
    b.classList.remove('on');
    if(card){ marcarCartao(card, false); rolarAteCartao(card); card.focus({preventScroll:true}); }
  });
  return b;
}
function initCompeticoesView(){
  const modo = window.COMP_TOQUE;
  const fixo = modo === 'expandir' ? botaoRecolher() : null;
  document.querySelectorAll('#app .comp-card[data-comp]').forEach(card=>{
    const c = window.__comps[+card.dataset.comp];
    card.querySelector('.comp-acao').innerHTML = modo === 'expandir' ? ACAO_VER : 'Ver resultados <span aria-hidden="true">→</span>';
    const agir = e=>{
      if(e.target.closest('a')) return;
      if(modo === 'expandir'){
        const fechar = e.target.closest('.comp-fechar button');
        if(e.target.closest('.comp-lista') && !fechar) return;   // tocar na lista não fecha o cartão por engano
        const abrir = !card.classList.contains('aberto');
        if(abrir) document.querySelectorAll('#app .comp-card.aberto').forEach(o=>marcarCartao(o, false));   // só um aberto por vez
        marcarCartao(card, abrir);
        // se o cartão subiu para fora da tela (outro fechou acima, ou recolheu pelo botão de baixo), volta ao topo dele
        if(fechar || card.getBoundingClientRect().top < topoLivre() - 12) rolarAteCartao(card);
        if(fechar) card.focus({preventScroll:true});
        fixo.atualizar();
      } else {
        window.__filtroComp = c.nome;
        location.hash = '#/resultados';
      }
    };
    card.addEventListener('click', agir);
    card.addEventListener('keydown', e=>{ if(e.target === card && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); agir(e); } });   // links e o botão de dentro usam o próprio Enter
  });
  window.__abaExtra = {
    get:()=>({anos:[...document.querySelectorAll('#app .year-box')].filter(d=>d.open).map(d=>d.dataset.ano),
              abertos:[...document.querySelectorAll('#app .comp-card.aberto')].map(c=>c.dataset.comp)}),
    set:e=>{
      document.querySelectorAll('#app .year-box').forEach(d=>{ d.open = e.anos.includes(d.dataset.ano); });
      e.abertos.forEach(i=>{ const c = document.querySelector(`#app .comp-card[data-comp="${i}"]`); if(c && !c.classList.contains('aberto')) c.click(); });
    }};
}

/* melhor marca da equipe por prova e sexo (só tempos válidos); águas abertas não têm piscina */
function melhoresMarcas(estilo, piscina){
  const aguas = estilo === 'Águas Abertas';
  const best = {};
  DATA.resultados.forEach(r=>{
    if(r.estilo !== estilo) return;
    if(!aguas && Number(r.piscina) !== Number(piscina)) return;
    const sec = timeToSec(r.tempo);
    if(!isFinite(sec) || sec <= 0) return;
    const k = r.distancia + '|' + r.sexo;
    if(!best[k] || sec < best[k].sec) best[k] = {...r, sec};
  });
  const dist = [...new Set(Object.values(best).map(r=>r.distancia))].sort((a,b)=>a-b);
  return dist.map(d=>({distancia:d, M:best[d+'|M'], F:best[d+'|F']}));
}

/* carrossel: anda sozinho; segurar e arrastar (dedo ou mouse) passa as fotos para frente ou para trás;
   ao soltar, desliza um pouco com o embalo e volta ao giro normal. Mouse em cima pausa; fora da tela para (bateria). */
function initGaleriaView(){
  const car = document.querySelector('#app .photo-carousel');
  if(!car || matchMedia('(prefers-reduced-motion: reduce)').matches) return;   // reduzir movimento: faixa parada que rola com o dedo (CSS)
  const track = car.querySelector('.photo-track');
  const slides = track.children, n = slides.length / 2;
  const SEG_POR_FOTO = 9;
  let ciclo = 0, x = 0, vel = 0, embalo = 0, ultimo = 0, quadro = 0;
  let arrastando = false, inicioX = 0, xInicio = 0, movX = 0, movT = 0, emCima = false, visivel = true, pausaAte = 0;
  const medir = ()=>{ ciclo = slides[n].offsetLeft - slides[0].offsetLeft; vel = ciclo / (n * SEG_POR_FOTO); };
  const pintar = ()=>{ if(ciclo){ x = ((x % ciclo) + ciclo) % ciclo; } track.style.transform = `translate3d(${-x}px,0,0)`; };
  const passo = t=>{
    quadro = 0;
    if(!document.getElementById('app').contains(car)) return;   // saiu da aba
    const dt = ultimo ? Math.min((t - ultimo) / 1000, .05) : 0; ultimo = t;
    if(!arrastando){
      if(Math.abs(embalo) > 5){ x += embalo * dt; embalo *= Math.pow(.05, dt); }   // embalo depois de soltar
      else { embalo = 0; if(!emCima && t > pausaAte) x += vel * dt; }
      pintar();
    }
    if(visivel) quadro = requestAnimationFrame(passo);
  };
  const ligar = ()=>{ if(!quadro){ ultimo = 0; quadro = requestAnimationFrame(passo); } };
  car.addEventListener('pointerdown', e=>{
    if(e.button !== 0) return;
    arrastando = true; inicioX = e.clientX; xInicio = x; movX = e.clientX; movT = e.timeStamp; embalo = 0;
    car.classList.add('arrastando'); car.setPointerCapture(e.pointerId);
  });
  car.addEventListener('pointermove', e=>{
    if(!arrastando) return;
    const dt = Math.max(e.timeStamp - movT, 1);
    embalo = -(e.clientX - movX) / dt * 1000;   // px/s, para o embalo ao soltar
    movX = e.clientX; movT = e.timeStamp;
    x = xInicio - (e.clientX - inicioX); pintar();
  });
  const soltar = e=>{
    if(!arrastando) return;
    arrastando = false; car.classList.remove('arrastando');
    if(e.timeStamp - movT > 80) embalo = 0;   // parou o dedo antes de soltar: sem embalo
    embalo = Math.max(-2500, Math.min(2500, embalo));
    pausaAte = performance.now() + 1200;   // respira um pouco antes de voltar a andar
  };
  car.addEventListener('pointerup', soltar);
  car.addEventListener('pointercancel', soltar);   // o navegador assumiu a rolagem vertical
  car.addEventListener('pointerenter', e=>{ if(e.pointerType === 'mouse') emCima = true; });
  car.addEventListener('pointerleave', e=>{ if(e.pointerType === 'mouse') emCima = false; });
  if(window.__galMedir) window.removeEventListener('resize', window.__galMedir);   // não acumula ao voltar para a aba
  window.__galMedir = medir; window.addEventListener('resize', medir);
  if('IntersectionObserver' in window){
    new IntersectionObserver(([e])=>{ visivel = e.isIntersecting; if(visivel) ligar(); }).observe(car);
  }
  medir(); pintar(); ligar();
  // as fotos podem terminar de carregar depois: mede de novo
  [...track.querySelectorAll('img')].forEach(img=>{ if(!img.complete) img.addEventListener('load', medir, {once:true}); });
}

  botoes.forEach(b=>b.addEventListener('click', ()=>{
    const s = document.getElementById(b.dataset.sec); if(!s) return;

    const fim = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;

<script>
/* ============ PILOTO v1 — movimento (GSAP + ScrollTrigger) ============ */
(function(){
  if(!window.gsap || !window.ScrollTrigger){ window.dmMotion = function(){}; return; }
  gsap.registerPlugin(ScrollTrigger);
  let mm = null;

  function makeBubbles(){
    const box = document.querySelector('.dm-bubbles');
    if(!box) return;
    const n = window.innerWidth < 700 ? 9 : 16;
    let html = '';
    for(let i=0;i<n;i++){
      const s = (4 + Math.random()*10).toFixed(1);
      html += `<span style="--x:${(Math.random()*100).toFixed(1)}%;--s:${s}px;--d:${(8+Math.random()*9).toFixed(1)}s;--delay:${(-Math.random()*16).toFixed(1)}s;--wob:${(Math.random()*60-30).toFixed(0)}px"></span>`;
    }
    box.innerHTML = html;
  }

  // Espera a fonte do título (no máx. 1,2 s) para a entrada não "pular" quando ela chega
  function fontsReady(){
    if(!document.fonts || !document.fonts.ready) return Promise.resolve();
    return Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r, 1200))]);
  }

  const RMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* v7: troca de aba — a página some um pouco para cima e volta subindo (só opacidade e posição) */
  let trans = null;
  window.dmTransition = function(swap){
    const app = document.getElementById('app');
    if(trans){ trans.kill(); trans = null; }
    if(RMQ.matches || !app || !app.firstElementChild){ if(app) gsap.set(app, {clearProps:'opacity,transform'}); swap(); return; }
    let trocou = false;
    const troca = ()=>{ if(!trocou){ trocou = true; swap(); } };
    const t = trans = gsap.timeline({onComplete:()=>{ if(trans === t) trans = null; ScrollTrigger.refresh(); }})
      .to(app, {opacity:0, y:-6, duration:.12, ease:'power2.in', overwrite:true})
      .add(troca)
      .fromTo(app, {opacity:0, y:14}, {opacity:1, y:0, duration:.28, ease:'power3.out', clearProps:'opacity,transform', immediateRender:false});
    // segurança: se a animação não rodar (aba em segundo plano), a página troca e aparece mesmo assim
    setTimeout(()=>{ if(trans === t && !trocou){ t.kill(); trans = null; gsap.set(app, {clearProps:'opacity,transform'}); troca(); } }, 450);
    setTimeout(()=>{ if(trans === t){ t.progress(1); } }, 1200);
  };

  /* v7: entrada das outras abas — o título sobe de trás de uma "linha d'água" e o resto entra em sequência ao rolar */
  const REVEAL = '#app .pagehead p, #app .filterbar, #app .nota50, #app .patro, #app .section-title, #app .section-sub, #app .acard, #app .tablewrap, #app .card, #app .comp-card, #app .caixa-ano, #app .record-card, #app .chartbox, #app .statcard';
  function subpageMotion(){
    const h1 = document.querySelector('#app .pagehead h1, #app .profile-head h1, #app h1');
    if(h1) gsap.fromTo(h1, {clipPath:'inset(0% 0% 100% 0%)', y:'0.45em'},
      {clipPath:'inset(0% 0% -20% 0%)', y:0, duration:.7, ease:'power3.out', delay:.05, clearProps:'clipPath,transform'});
    let items = gsap.utils.toArray(REVEAL);
    // dentro de caixas que abrem/fecham (<details>) a posição muda depois: essas entram sem animação
    items = items.filter(el=>!el.parentElement.closest('details'));
    items = items.filter(el=>!items.some(o=>o!==el && o.contains(el))).slice(0, 60);
    if(!items.length) return;
    gsap.set(items, {y:20, opacity:0});
    ScrollTrigger.batch(items, {start:'top 94%', once:true, interval:.05, batchMax:10,
      onEnter: b => gsap.to(b, {y:0, opacity:1, duration:.55, ease:'power3.out', stagger:Math.min(.06, .3/b.length), overwrite:true, clearProps:'transform,opacity'})});
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>ScrollTrigger.refresh());
  }

  window.dmMotion = function(key){
    if(mm){ mm.revert(); mm = null; }
    ScrollTrigger.getAll().forEach(t=>t.kill());
    if(key !== '/'){
      mm = gsap.matchMedia();
      mm.add('(prefers-reduced-motion: no-preference)', ()=>{
        try{ subpageMotion(); }catch(err){ gsap.set('#app *', {clearProps:'opacity,transform,clipPath'}); }
      });
      return;
    }

    makeBubbles();
    // Pausa a água quando a abertura sai da tela (economiza bateria ao rolar)
    ScrollTrigger.create({trigger:'.dm-hero', start:'top top', end:'bottom top',
      onLeave:()=>document.querySelector('.dm-hero').classList.add('is-off'),
      onEnterBack:()=>document.querySelector('.dm-hero').classList.remove('is-off')});

    mm = gsap.matchMedia();
    mm.add('(prefers-reduced-motion: no-preference)', ()=>{
      // Entrada da abertura: só transform e opacidade (não recalcula o layout a cada quadro)
      const intro = gsap.timeline({paused:true, defaults:{ease:'power3.out', force3D:true}})
        .from('.dm-eyebrow', {y:16, autoAlpha:0, duration:.6})
        .from('.dm-title-dm', {y:44, autoAlpha:0, duration:.9}, '-=.35')
        .from('.dm-lead', {y:16, autoAlpha:0, duration:.6}, '-=.6')
        .from('.dm-actions .btn', {y:14, autoAlpha:0, duration:.5, stagger:.08, clearProps:'transform,opacity,visibility'}, '-=.45')
        .from('.dm-stats .statcard', {y:28, autoAlpha:0, duration:.6, stagger:.06, clearProps:'transform,opacity,visibility'}, '-=.35');
      fontsReady().then(()=>intro.play());

      // Números contando (depois que os cartões chegam)
      document.querySelectorAll('.dm-stats .stat-num').forEach(el=>{
        const v = parseInt(el.textContent, 10);
        if(!v) return;
        const o = {n:0};
        el.textContent = '0';
        intro.call(()=>gsap.to(o, {n:v, duration:1.2, ease:'power2.out', onUpdate(){ el.textContent = Math.round(o.n); }}), null, '-=.3');
      });

      // Parallax da piscina ao rolar: camadas em velocidades diferentes
      const hero = {trigger:'.dm-hero', start:'top top', end:'bottom top', scrub:.4};
      gsap.to('.dm-hero-content', {yPercent:-16, opacity:.1, ease:'none', scrollTrigger:hero});
      gsap.to('.dm-caustics', {y:90, ease:'none', scrollTrigger:hero});
      gsap.to('.dm-floor', {y:40, ease:'none', scrollTrigger:hero});
      gsap.to('.dm-bubbles', {y:-150, ease:'none', scrollTrigger:hero});

      // Seções entram suaves, em sequência
      const items = gsap.utils.toArray('#app .section-title, #app .section-sub, #app .hl-subhead, #app .chartbox, #app .nota50, #app .patro, #app .gridcols2 > .card, #app .staffduo-highlight, #app .comp-card');
      gsap.set(items, {y:28, opacity:0});
      ScrollTrigger.batch(items, {start:'top 90%', once:true,
        onEnter: batch => gsap.to(batch, {y:0, opacity:1, duration:.6, ease:'power2.out', stagger:.07, overwrite:true, clearProps:'transform,opacity'})});

      // Foto do corpo técnico: a "água sobe" revelando a imagem
      gsap.fromTo('.staffduo-photo', {clipPath:'inset(100% 0% 0% 0% round 12px)'},
        {clipPath:'inset(0% 0% 0% 0% round 12px)', duration:1.1, ease:'power3.inOut',
         scrollTrigger:{trigger:'.staffduo-photo', start:'top 85%', once:true}});
    });
  };
})();
</script>

/* Theme toggle */
(function(){
  const root = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  function applyIcon(){ btn.setAttribute('aria-pressed', root.getAttribute('data-theme') === 'dark' ? 'true' : 'false'); }
  btn.addEventListener('click', function(){
    const cur = root.getAttribute('data-theme');
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    applyIcon();
    if(location.hash.slice(1).startsWith('/atleta/') || currentHash()==='/'){
      /* re-render to refresh chart colors */
      navigate();
    }
  });
  applyIcon();
  /* No celular o botão dia/noite mora dentro do menu; no computador, na barra */
  const mq = window.matchMedia('(max-width:940px)');
  const barSlot = btn.parentNode, menuSlot = document.getElementById('nav-theme-row');
  function placeToggle(){
    if(mq.matches){ if(btn.parentNode !== menuSlot) menuSlot.appendChild(btn); }
    else if(btn.parentNode !== barSlot) barSlot.insertBefore(btn, barSlot.firstChild);
  }
  placeToggle();
  if(mq.addEventListener) mq.addEventListener('change', placeToggle); else mq.addListener(placeToggle);
})();
/* Mobile nav burger */
(function(){
  const burger = document.getElementById('nav-burger');
  const links = document.getElementById('navlinks');
  const shade = document.getElementById('navshade');
  function setOpen(o){ links.classList.toggle('open',o); burger.classList.toggle('open',o); shade.classList.toggle('open',o);
    burger.setAttribute('aria-expanded', o?'true':'false'); burger.setAttribute('aria-label', o?'Fechar menu':'Abrir menu'); }
  burger.addEventListener('click', function(){ setOpen(!links.classList.contains('open')); });
  links.addEventListener('click', function(e){ if(e.target.classList.contains('navlink')) setOpen(false); });
  shade.addEventListener('click', function(){ setOpen(false); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') setOpen(false); });
})();
/* Boot */
navigate();
